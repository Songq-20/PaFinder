[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pafinder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "xlrd>=2.0"]
[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
[tool.setuptools.packages.find]
where = ["src"]
[project.scripts]
pafinder = "pafinder.cli:main"
